name: Parent account and child management gate

on:
  pull_request:
    paths:
      - "src/pages/Auth.tsx"
      - "e2e/auth-recovery.spec.ts"
      - "src/pages/ChildControlV2.tsx"
      - "src/components/ReconnectChildV2Modal.tsx"
      - "src/components/RemoveChildV2Modal.tsx"
      - "src/lib/v2/childManagementService.ts"
      - "src/lib/v2/childReconnectService.ts"
      - "src/lib/v2/guardianService.ts"
      - "src/integrations/supabase/v2-types.ts"
      - "e2e/v2-child-management.spec.ts"
      - "e2e/v2-parent-routes.spec.ts"
      - "supabase-v2/supabase/migrations/20260910200000_v2_archive_guardian_child.sql"
      - ".github/workflows/parent-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: npm exec tsc -- --noEmit -p tsconfig.app.json

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Parent browser regressions
        run: npm run test:e2e
