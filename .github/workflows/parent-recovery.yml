name: Parent recovery gate

on:
  pull_request:
    paths:
      - "src/pages/Auth.tsx"
      - "e2e/auth-recovery.spec.ts"
      - ".github/workflows/parent-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: npm exec tsc -- --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Recovery regression
        run: npm exec playwright test -- e2e/auth-recovery.spec.ts
